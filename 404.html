<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Pagina non trovata | Agenzia Lisa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: linear-gradient(135deg, #fff 0%, #f4eeee 100%); text-align: center; }
    .error-card { width: min(620px, 100%); padding: 3rem 2rem; background: #fff; border-radius: 24px; box-shadow: 0 18px 60px rgba(42, 15, 15, .12); }
    .error-logo { width: 180px; height: auto; margin-bottom: 1rem; }
    .error-code { display: block; color: #9b1a1a; font-size: clamp(4rem, 15vw, 7rem); line-height: 1; font-weight: 900; }
    .error-card h1 { margin: .6rem 0; color: #211b1b; }
    .error-card p { color: #666; margin: 0 auto 1.7rem; max-width: 460px; }
    .error-actions { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <img class="error-logo" src="logo.png" alt="Agenzia Lisa">
      <span class="error-code">404</span>
      <h1>Questa pagina non è disponibile</h1>
      <p>L'indirizzo potrebbe essere errato. Torna al sito oppure scrivici: ti aiutiamo noi.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">Torna al sito</a>
        <a class="btn btn-outline" href="https://wa.me/393478397377?text=Salve%2C%20vorrei%20informazioni%20sui%20vostri%20servizi." target="_blank" rel="noopener">Scrivici su WhatsApp</a>
      </div>
    </section>
  </main>
</body>
</html>
